name: Scrapers empleo público

# Corre el batch de scrapers (run_all.py) en GitHub Actions, fuera de Railway.
# El runner es Ubuntu en Azure (IP de datacenter EE.UU.): si algunas fuentes
# .gob.cl te bloquean por IP, ese es el motivo — ahí se evalúa un proxy chileno
# o un self-hosted runner. Ver conversación / docs/SCRAPERS_REVIEW.md.

on:
  schedule:
    # GitHub Actions usa UTC. 11:00 y 23:00 UTC ≈ 7:00 y 19:00 hora Chile en
    # invierno (UTC-4). En verano chileno (UTC-3) caen a las 8:00 y 20:00.
    # Mismo criterio que el systemd timer del repo (deploy/systemd).
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  # Permite dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Evita que dos corridas se solapen (el batch es idempotente, pero no tiene
# sentido pisarse). No cancela una corrida en curso: deja que termine.
concurrency:
  group: scrapers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrapers:
    runs-on: ubuntu-latest
    # El batch completo (setup + Playwright + ~24 módulos + revalidación) supera
    # los 60 min cuando municipios/carabineros van lentos: la corrida del
    # 2026-07-07 00:07 UTC fue CANCELADA a los 60' en plena ejecución, dejando
    # sin correr universidades/adp y la revalidación de URLs. El tope real lo
    # pone el `timeout-minutes` del paso run_all; este es solo el paraguas.
    timeout-minutes: 100
    env:
      # IMPORTANTE: DATABASE_URL debe ser la URL PÚBLICA del Postgres de Railway
      # (host tipo *.proxy.rlwy.net o el "public networking" de Railway), con la
      # contraseña incluida. La interna *.railway.internal NO es alcanzable desde
      # GitHub. Se guarda en Settings → Secrets and variables → Actions.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      LOG_DIR: logs
      # Proxy de salida CL para scrapers FF.AA./policía (WAF/geobloqueo por IP).
      # Crea el secret PROXY_CL con el endpoint de la zona Residential
      # (http://usuario:password@host:puerto). Si el secret no existe, queda
      # vacío y los scrapers salen directo — no rompe nada.
      PROXY_CL: ${{ secrets.PROXY_CL }}
      # Opcionales: descomenta y crea el secret si los necesitas en el batch.
      # SITE_URL: ${{ secrets.SITE_URL }}
      # MEILISEARCH_URL: ${{ secrets.MEILISEARCH_URL }}
      # MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
      # RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador Playwright (scrapers JS/anti-bot)
        run: python -m playwright install --with-deps chromium

      - name: Validar que DATABASE_URL esté configurada
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Falta el secret DATABASE_URL (URL pública del Postgres de Railway)."
            exit 1
          fi

      - name: Correr scrapers (run_all.py)
        # Tope propio < timeout del job, para que si el batch se cuelga igual
        # alcancen a correr la revalidación de URLs y la subida de logs.
        timeout-minutes: 85
        run: python scrapers/run_all.py --mode production

      - name: Revalidar URLs de ofertas activas
        # run_all.py NO corre validate_offer_urls.py automáticamente (sí lo hace
        # el orquestador legacy). Lo lanzamos acá para que el frontend pueda
        # gatear los botones "Ver bases" / "Postular" con flags al día.
        # `always()`: aunque el batch falle o se corte por timeout, lo ya
        # insertado en la DB merece flags de URL al día.
        if: always()
        run: python validate_offer_urls.py --workers 20 --max-edad-h 24

      - name: Subir logs como artefacto (si existen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
