name: Reporte de calidad del catálogo

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC todos los días (~08:00 Chile)
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas
        run: pip install --quiet psycopg2-binary

      - name: Correr reporte (JSON + log)
        id: rep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          python scripts/reporte_calidad_catalogo.py --json > calidad.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          # También dejamos el resumen legible en el log de la corrida:
          cat calidad.json

      - name: Subir reporte como artifact (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad
          path: calidad.json

      - name: Fallar si hay hallazgos de severidad ALTA
        if: steps.rep.outputs.code != '0'
        run: |
          echo "::warning::El catálogo tiene hallazgos de severidad ALTA. Revisá el artifact 'reporte-calidad'."
          exit 1
