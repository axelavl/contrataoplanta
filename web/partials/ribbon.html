<div class="ribbon" role="status" aria-live="polite">
  <div class="ribbon-inner">
    <span class="ribbon-item">
      <span class="ribbon-dot" aria-hidden="true"></span>
      Actualizado hace
      <strong id="ribbon-actualizado">—</strong>
    </span>
    <span class="ribbon-item">
      <strong id="ribbon-vigentes">—</strong>
      cargos vigentes
    </span>
    <span class="ribbon-item ribbon-item--sm-hide">
      <strong id="ribbon-cierran">—</strong>
      <span id="ribbon-cierran-label">cierran hoy</span>
    </span>
    <button type="button" id="ribbon-refresh" class="ribbon-refresh"
            aria-label="Actualizar ofertas y datos ahora" title="Actualizar ahora">
      <span class="ribbon-refresh-icon" aria-hidden="true">↻</span>
      <span class="ribbon-refresh-label">Actualizar</span>
    </button>
  </div>
</div>
