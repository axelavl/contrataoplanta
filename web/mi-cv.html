<!DOCTYPE html>
<html lang="es">
<head>
<script src="boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Buscar ofertas con tu CV — contrata o planta .cl</title>
<meta name="description" content="Sube tu CV y te sugerimos ofertas de empleo público vigentes afines a tu perfil, explicando por qué calza cada una. Tu CV no se guarda.">
<link rel="canonical" href="https://contrataoplanta.cl/mi-cv">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0A2E6E">
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/shared-layout.css">
<link rel="stylesheet" href="styles/redesign-overrides.css">
<link rel="stylesheet" href="styles/integracion/estilos.css">
<link rel="stylesheet" href="styles/cv-match.css?v=20261027c">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased;min-height:100vh}
.page-body{max-width:860px;margin:0 auto;padding:32px 16px 64px}
.cv-resultado-pagina{margin-top:28px}
.skip-link{position:absolute;left:12px;top:-48px;z-index:1000;background:var(--azul,#0A2E6E);color:var(--blanco,#FAFAF8);padding:10px 14px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;transition:top .2s}
.skip-link:focus{top:10px}

</style>
<script defer src="shared-shell.js"></script>
</head>
<body data-page="micv">
<a class="skip-link" href="#contenido-principal">Saltar al contenido</a>

<div id="site-ribbon"></div>
<div id="site-header"></div>

<nav class="breadcrumb" aria-label="Ruta de navegación">
  <div class="breadcrumb-inner">
    <a href="index.html">Inicio</a>
    <span class="breadcrumb-sep">›</span>
    <span class="breadcrumb-actual">Buscar con mi CV</span>
  </div>
</nav>

<main id="contenido-principal">
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-kicker">Ofertas a tu medida</div>
    <h1 class="page-titulo">Sube tu CV y te mostramos dónde calzas</h1>
    <p class="page-sub">Comparamos tu formación, experiencia y región con las ofertas vigentes, y te explicamos por qué calza cada una y qué te falta acreditar.</p>
  </div>
</div>

<div class="page-body">
  <form class="cv-card" data-cv-form data-cv-destino="#cv-resultado" novalidate>
    <label class="cv-drop" data-cv-drop>
      <input type="file" data-cv-archivo name="archivo" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      <span class="cv-drop-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/></svg></span>
      <span class="cv-drop-titulo">Elige tu CV o arrástralo aquí</span>
      <span class="cv-drop-sub">PDF o Word (.docx), hasta 5 MB</span>
      <span class="cv-archivo" data-cv-nombre aria-live="polite"></span>
    </label>
    <label class="cv-consent">
      <input type="checkbox" data-cv-consent name="consentimiento">
      <span>Autorizo que mi CV se procese solo para sugerirme ofertas. Se lee en el momento y <strong>no se guarda</strong> en ningún servidor ni base de datos (Ley 19.628 y Ley 21.719). <a href="privacidad.html#cv">Más información</a>.</span>
    </label>
    <button type="submit" class="cv-btn" data-cv-btn disabled>Buscar ofertas para mi perfil</button>
    <div class="cv-estado" data-cv-estado role="status" aria-live="polite"></div>
  </form>

  <div class="cv-resultado-pagina" id="cv-resultado" hidden></div>
</div>
</main>

<div id="site-footer"></div>

<script src="cv-match.js?v=20261027c"></script>
<script src="nav-mobile.js"></script>
</body>
</html>
