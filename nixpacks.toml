# ============================================================
#  Railway / Nixpacks — Chromium para Playwright
# ============================================================
# Habilita los scrapers que renderizan JS / superan anti-bot:
#   - bcentral (Imperva Incapsula)
#   - laborum  (SPA Navent: Hospital Militar 707, EFE 279)
#
# Este archivo SÓLO AGREGA dos cosas y no toca nada más:
#   1) [phases.setup].aptPkgs  → las librerías de sistema que Chromium headless
#      necesita para arrancar (si faltan, Playwright lanza "browser closed").
#   2) [phases.build].cmds      → baja el binario de Chromium DESPUÉS del
#      `pip install` (que Nixpacks sigue haciendo solo). Corre en build, así el
#      navegador queda horneado en la imagen y disponible en runtime.
#
# El comando de arranque (uvicorn / run_all.py) lo sigue resolviendo Nixpacks
# o tu "Start Command" del dashboard — acá no se redefine.

[phases.setup]
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libatspi2.0-0",
  "libxshmfence1",
]

[phases.build]
cmds = ["python -m playwright install chromium"]
