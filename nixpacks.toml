# nixpacks.toml — configuración de build para Railway (builder Nixpacks).
#
# ⚠️ SOLO aplica si el servicio de Railway usa el builder Nixpacks. El servicio
# actual usa RAILPACK (existe railpack.json, y ahí `deploy.aptPackages` es lo
# que de verdad instala tesseract-ocr/tesseract-ocr-spa en el contenedor).
# Este archivo se conserva por si el builder vuelve a Nixpacks; mantener ambos
# en sincronía.
#
# Railway autodetecta el proyecto Python y ya instala las dependencias de
# `requirements.txt` (entre ellas `pytesseract`). Lo único que pip NO puede
# instalar es el BINARIO de sistema de OCR, así que lo añadimos acá:
#
#   tesseract-ocr      → motor OCR
#   tesseract-ocr-spa  → datos del idioma español
#
# Lo usa scrapers/carabineros.py cuando corre con --ocr para leer las "Bases"
# del concurso, que Carabineros publica como PDF escaneado (sin capa de texto).
# Si estos paquetes faltaran, el scraper degrada sin error (solo no lee esos
# PDFs), pero con ellos el OCR queda operativo en producción.
#
# `aptPkgs` es ADITIVO: se suma a la fase de setup que Nixpacks genera
# automáticamente (Python, etc.), no la reemplaza ni cambia el start command
# (ese se configura en el dashboard de Railway).
[phases.setup]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-spa"]

# ── Navegador Playwright (Chromium) ──────────────────────────────────────────
# Varios scrapers son OBLIGATORIAMENTE de navegador: laborum.py (TVN 280,
# EFE 279, Hospital Militar 707 — la grilla es SPA), bcentral.py (Incapsula)
# y el fallback Playwright de trabajando.py (wrappers como empleos.tvn.cl).
# `pip install playwright` instala solo la librería; sin este paso el binario
# de Chromium NO existe en producción y esas fuentes quedan mudas (0 ofertas,
# sin error visible). Se instala en el BUILD (no en runtime: el contenedor del
# cron es efímero y lo re-descargaría en cada corrida).
#
# PLAYWRIGHT_BROWSERS_PATH fija una ruta estable dentro de la imagen para que
# el binario descargado en build sea el mismo que resuelve el runtime (sin la
# variable, cada etapa calcularía su propio ~/.cache).
[variables]
PLAYWRIGHT_BROWSERS_PATH = "/opt/ms-playwright"

[phases.build]
cmds = ["python -m playwright install --with-deps chromium"]
